[project]
name = "gipsy-backend"
version = "0.1.0"
description = "Project Gipsy Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "websockets==17.4",
    "psutil==7.2.2",
    "sounddevice==0.5.6",
    "numpy==2.4.6",
    "faster-whisper==1.2.1",
    "onnxruntime==1.32.0",
    "kokoro-onnx==0.6.1",
    "soundfile==0.14.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
